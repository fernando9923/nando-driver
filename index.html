<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4F6F52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nando Driver">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nando Driver</title>
<style>
:root{--bg:#F3F6EF;--sf:#fff;--tx:#1E2A21;--mu:#5D6E60;--ln:#D5DECB;--pr:#4F6F52;--soft:#DCE8D3;--ok:#2E7D4F;--bad:#B3261E;--warn:#B26A00;--navh:60px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}
#hdr{background:var(--pr);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;flex:none}
#hdr .hl{flex:1;min-width:0}#hdr b{font-size:18px;display:block}#hdr small{color:var(--soft)}
.chip{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--soft);color:#1E3322}
.chip.off{background:#F2D7D5}
#app{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
#nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;height:var(--navh);border:0;background:none;color:var(--mu);font-weight:700;font-size:13px}
#nav button.on{color:var(--pr);background:var(--soft)}
#nav i{display:block;font-style:normal;font-size:22px;line-height:1}
h1{font-size:28px;margin:0 0 6px}h2{font-size:22px;margin:0 0 4px}h3{margin:0 0 10px}
.mu{color:var(--mu)}.sm{font-size:13px}.bad{color:var(--bad)}.okc{color:var(--ok)}.warn{color:var(--warn)}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.grow small,.grow b{display:block}
.n{background:var(--pr);color:#fff;font-weight:700;border-radius:99px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.btn.out{background:#fff;color:var(--tx);border:1px solid var(--ln)}
.btn:disabled{opacity:.5}
.lnk{border:0;background:none;color:var(--pr);font-weight:700;font-size:15px;padding:8px}
.lnk.w{color:#fff}.lnk.bad{color:var(--bad)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=password],select{width:100%;font:17px -apple-system,system-ui,sans-serif;padding:12px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx)}
input.err,select.err{border-color:var(--bad)}
.er{color:var(--bad);font-size:13px}
.seg{display:flex;gap:8px}.seg button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:15px}
.seg button.on{background:var(--soft);border-color:var(--pr)}
.ph{display:flex;align-items:center;gap:12px;cursor:pointer}
.th{width:72px;height:72px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#1E3322;font-weight:600;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.ph.err{outline:2px solid var(--bad);outline-offset:2px;border-radius:10px}
hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.sw{position:relative;height:64px;border-radius:32px;background:var(--pr);overflow:hidden;margin-top:8px;user-select:none;-webkit-user-select:none}
.swl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;pointer-events:none}
.swt{position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:50%;background:#fff;color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;touch-action:none}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin:10px 0}
.chips button{flex:none;border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button.on{background:var(--soft);border-color:var(--pr)}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:#1E3322}
.tag.w{background:#FFE8C2}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.mc{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.mc .acts{display:flex;gap:10px}.mc .acts .btn{margin-top:12px}
.mc p{margin:4px 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:#1E2A21;color:#fff;border-radius:12px;padding:12px 16px;text-align:center}
.tip{background:#FFF6DD;border:1px solid #F0DFA6;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
</style></head>
<body>
<div id="hdr" hidden></div>
<div id="app"></div>
<nav id="nav" hidden>
  <button id="n-home" class="on"><i>&#8962;</i>Beranda</button>
  <button id="n-hist"><i>&#9776;</i>Riwayat</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" accept="image/*" capture="environment" id="fi-b" hidden>
<input type="file" accept="image/*" capture="environment" id="fi-p" hidden>

<script>
'use strict';
var API='https://script.google.com/macros/s/AKfycbzreiKQzwtYgCFZuiEWDUk2or86CJLv-4o24vr3vi10B4efPR-1Z6qjCy2_Qm30EcaZ/exec';
var FB_URL='https://nando-driver-default-rtdb.asia-southeast1.firebasedatabase.app';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n0(v){return Math.round(v).toLocaleString('id-ID')}
function k2(v){return Number(v).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function now(){var d=new Date(),o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);
  return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+s+pad(Math.floor(a/60))+':'+pad(a%60)}
var lastTap=0;function once(){var t=Date.now();if(t-lastTap<1500)return false;lastTap=t;return true}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}

/* ---------- state ---------- */
var S={u:ls('u',''),p:ls('p',''),nama:ls('nama',''),co:ls('co',[]),trip:ls('trip',''),n:ls('n',0),stops:ls('stops',[]),
  pending:0,queued:{},err:ls('err',''),online:navigator.onLine};
var V='home',tab='home',ST=null;
var H={data:ls('hist',[]),ver:'',fetched:false,sel:0,loading:false};
function persist(){sv('trip',S.trip);sv('n',S.n);sv('stops',S.stops)}

/* ---------- antrean offline (IndexedDB) ---------- */
var dbp=new Promise(function(res,rej){var r=indexedDB.open('nando',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('q',{keyPath:'k',autoIncrement:true})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function qAll(){return dbp.then(function(d){return rq(d.transaction('q').objectStore('q').getAll())})}
function qAdd(o){return dbp.then(function(d){return rq(d.transaction('q','readwrite').objectStore('q').add(o))})}
function qDel(k){return dbp.then(function(d){return rq(d.transaction('q','readwrite').objectStore('q').delete(k))})}
function refreshQ(){return qAll().then(function(a){S.pending=a.length;S.queued={};a.forEach(function(i){if(i.action==='saveStop')S.queued[i.id_titik]=1})})}

function post(b){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),redirect:'follow'})
    .then(function(r){return r.text()}).then(function(t){return JSON.parse(t)})}
var busy=false;
function flush(){
  if(busy||!S.online||!S.u)return Promise.resolve();
  busy=true;
  return qAll().then(function(items){
    var chain=Promise.resolve(true);
    items.forEach(function(it){chain=chain.then(function(go){
      if(!go)return false;
      var b={},k;for(k in it)b[k]=it[k];delete b.k;b.username=S.u;b.password=S.p;
      return post(b).then(function(r){
        if(!r.ok){S.err=r.error||'Gagal';sv('err',S.err);return false}
        S.err='';sv('err','');return qDel(it.k).then(function(){return true})})})});
    return chain}).catch(function(){}).then(function(){busy=false;return refreshQ()}).then(function(){render()})}

/* ---------- lokasi, foto, tracking ---------- */
function getPos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej(new Error('GPS tidak tersedia'));
  navigator.geolocation.getCurrentPosition(function(p){res(p.coords)},function(e){
    rej(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan di Pengaturan iPhone > Privasi > Layanan Lokasi > Safari / Nando Driver.':'Lokasi belum tersedia. Pastikan GPS menyala lalu coba lagi.'))},
    {enableHighAccuracy:true,timeout:30000,maximumAge:10000})})}
function shrink(file){return new Promise(function(res,rej){
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,m=1600;
    if(Math.max(w,h)>m){var k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.65).split(',')[1])};
  img.onerror=function(){rej(new Error('Foto tidak bisa dibaca'))};img.src=url})}
var watchId=null,lastPush=0,lastCoord=null,wake=null;
function pushLoc(c,active){
  if(!S.u||!FB_URL)return;
  fetch(FB_URL+'/live/'+S.u.replace(/[.$#\[\]\/]/g,'_')+'.json',{method:'PUT',
    body:JSON.stringify({lat:c.latitude,lng:c.longitude,t:Date.now(),aktif:active,nama:S.nama||S.u,trip:S.trip||''})}).catch(function(){})}
function lockScreen(){try{if('wakeLock' in navigator&&!wake){navigator.wakeLock.request('screen').then(function(w){wake=w;w.addEventListener('release',function(){wake=null})}).catch(function(){})}}catch(e){}}
function startTrack(){
  if(!navigator.geolocation||!FB_URL||watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(function(p){lastCoord=p.coords;var t=Date.now();
    if(t-lastPush>15000){lastPush=t;pushLoc(p.coords,true)}},function(){},{enableHighAccuracy:true,maximumAge:5000});
  lockScreen()}
function stopTrack(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  pushLoc(lastCoord||{latitude:0,longitude:0},false);
  try{if(wake)wake.release()}catch(e){}wake=null}

/* ---------- popup ---------- */
function modal(title,body,btns){
  var m=$('#modal');m.innerHTML='<div class="mc"><h3>'+title+'</h3><div>'+body+'</div><div class="acts" id="macts"></div></div>';m.hidden=false;
  var a=$('#macts');btns.forEach(function(b){var el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.t;
    el.onclick=function(){b.f?b.f(el):closeModal()};a.appendChild(el)})}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',function(e){if(e.target===$('#modal'))closeModal()});

/* ---------- tombol geser ---------- */
function swipe(el,label,onDone){
  el.innerHTML='<div class="sw"><span class="swl">'+label+'</span><div class="swt">&raquo;</div></div>';
  var sw=el.firstChild,t=sw.querySelector('.swt'),l=sw.querySelector('.swl'),x=0,drag=false,sx=0,max=0;
  t.addEventListener('pointerdown',function(e){drag=true;max=sw.clientWidth-t.clientWidth-8;sx=e.clientX-x;t.setPointerCapture(e.pointerId);t.style.transition='none'});
  t.addEventListener('pointermove',function(e){if(!drag)return;x=Math.min(max,Math.max(0,e.clientX-sx));t.style.transform='translateX('+x+'px)';l.style.opacity=1-x/max});
  function end(){if(!drag)return;drag=false;t.style.transition='transform .2s';
    var ok=max>0&&x>=max*0.85;x=0;t.style.transform='';l.style.opacity=1;
    if(ok){if(navigator.vibrate)navigator.vibrate(30);onDone()}}
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end)}

/* ---------- tampilan ---------- */
function renderHeader(){
  var h=$('#hdr');h.hidden=!S.u;if(!S.u)return;
  var st=!S.online?'Offline':(S.pending?'Mengirim '+S.pending:'Terkirim');
  h.innerHTML='<div class="hl"><b>Nando Driver</b><small>'+esc(S.nama)+'</small></div>'
    +((!S.trip&&!S.pending)?'<button class="lnk w" data-a="logout">Keluar</button>':'')
    +'<span class="chip '+(S.online?'':'off')+'">'+st+'</span>'}
function render(){
  renderHeader();
  $('#nav').hidden=!S.u||V==='stop';
  $('#n-home').className=tab==='home'?'on':'';$('#n-hist').className=tab==='history'?'on':'';
  if(V==='stop')return;
  var a=$('#app');
  if(!S.u){a.innerHTML=loginHtml();return}
  if(tab==='history'){a.innerHTML=histHtml();return}
  a.innerHTML=homeHtml();
  if($('#sw1'))swipe($('#sw1'),'Geser untuk mulai antar',startTrip);
  if($('#sw2'))swipe($('#sw2'),'Geser untuk selesai',finishTrip)}

function loginHtml(){
  var ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
  return '<div class="center"><h1 style="color:var(--pr)">Nando Driver</h1><p class="mu">Masuk untuk mulai mengantar</p>'
    +(ios?'<div class="tip">Supaya seperti aplikasi: tekan tombol Bagikan di Safari, lalu pilih <b>Tambahkan ke Layar Utama</b>.</div>':'')
    +'<label>Username<input type="text" id="lu" autocapitalize="none" autocomplete="username"></label>'
    +'<label>Password<input type="password" id="lp" autocomplete="current-password"></label>'
    +'<button class="btn" data-a="login">Masuk</button><p class="bad" id="le"></p></div>'}
function homeHtml(){
  if(!S.trip)return '<div class="center"><h1>Siap mengantar?</h1><p class="mu">Geser tombol di bawah saat berangkat dari gudang. Izinkan lokasi saat diminta.</p><div id="sw1"></div>'+errHtml()+'</div>';
  var h='<h2>Perjalanan berjalan</h2><p class="mu">'+S.stops.length+' titik tersimpan</p>';
  S.stops.forEach(function(s,i){var up=!S.queued[s.id];
    h+='<div class="card row"><span class="n">'+(i+1)+'</span><div class="grow"><b>'+esc(s.nama)+'</b><small class="mu">Nota '+esc(s.nota)+(s.parkir?' | Parkir':'')+'</small>'
      +'<small class="'+(up?'okc':'warn')+'">'+(up?'Terupload':'Menunggu upload')+'</small></div><button class="lnk bad" data-a="del" data-v="'+esc(s.id)+'">Hapus</button></div>'});
  h+='<button class="btn" data-a="add">Tambah titik '+(S.stops.length+1)+'</button>';
  h+=S.stops.length?'<div id="sw2"></div>':'<button class="btn out" data-a="cancel">Batal perjalanan</button>';
  h+='<p class="mu sm" style="text-align:center">Biarkan aplikasi tetap terbuka selama mengantar.</p>'+errHtml();
  return h}
function errHtml(){
  return (S.err?'<p class="bad sm">Server: '+esc(S.err)+'</p>':'')
    +((S.pending>0&&S.online)?'<button class="lnk" data-a="upl">Upload sekarang</button>':'')}

/* ---------- aksi perjalanan ---------- */
function startTrip(){
  if(!once()||S.trip)return;
  var t=now(),id=S.u+'-'+Date.now();
  qAdd({action:'startTrip',id_perjalanan:id,tanggal:t.slice(0,10),waktu:t}).then(function(){
    S.trip=id;S.n=0;S.stops=[];persist();startTrack();toast('Perjalanan dimulai. Selamat bekerja!');
    return refreshQ()}).then(function(){render();flush()})}
function finishTrip(){
  if(!once()||!S.trip)return;
  qAdd({action:'finishTrip',id_perjalanan:S.trip,waktu:now()}).then(function(){
    S.trip='';S.n=0;S.stops=[];persist();stopTrack();toast('Perjalanan selesai');return refreshQ()}).then(function(){render();flush()})}
function cancelTrip(){
  if(!once()||!S.trip)return;
  qAdd({action:'deleteTrip',id_perjalanan:S.trip}).then(function(){
    S.trip='';S.n=0;S.stops=[];persist();stopTrack();toast('Perjalanan dibatalkan');return refreshQ()}).then(function(){render();flush()})}
function delStop(id){
  var s=S.stops.filter(function(x){return x.id===id})[0];if(!s)return;
  modal('Hapus titik '+esc(s.nama)+'?','<p>Foto titik ini di Telegram juga akan terhapus.</p>',[
    {t:'Batal',cls:'out'},
    {t:'Hapus',f:function(){closeModal();
      qAdd({action:'deleteStop',id_perjalanan:S.trip,id_titik:id}).then(function(){
        S.stops=S.stops.filter(function(x){return x.id!==id});persist();return refreshQ()}).then(function(){render();flush()})}}])}
function logout(){
  S.u='';S.p='';localStorage.removeItem('u');localStorage.removeItem('p');V='home';tab='home';render()}
function login(){
  var u=$('#lu').value.trim(),p=$('#lp').value;$('#le').textContent='';
  if(!u||!p){$('#le').textContent='Isi username dan password';return}
  var btn=$('[data-a=login]');btn.disabled=true;btn.textContent='Memproses...';
  post({action:'login',username:u,password:p}).then(function(r){
    if(!r.ok)throw new Error(r.error||'Gagal masuk');
    S.u=u;S.p=p;S.nama=r.data.nama||u;S.co=r.data.perusahaan||[];
    sv('u',S.u);sv('p',S.p);sv('nama',S.nama);sv('co',S.co);
    if(S.trip)startTrack();
    return refreshQ()}).then(function(){render();flush()})
  .catch(function(e){var b=$('[data-a=login]');if(b){b.disabled=false;b.textContent='Masuk'}
    $('#le').textContent=(e instanceof TypeError)?'Tidak ada internet. Login butuh internet.':e.message})}

/* ---------- form titik ---------- */
function stopHtml(){
  var opts='<option value="">Pilih perusahaan internal</option>'+S.co.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
  return '<h2>Titik '+(S.stops.length+1)+'</h2>'
    +'<label>Nama lokasi<input type="text" id="f-nama" autocomplete="off"></label><div class="er" id="e-nama"></div>'
    +'<label>Nomor nota<input type="text" id="f-nota" autocomplete="off"></label><div class="er" id="e-nota"></div>'
    +'<label>Keterangan (opsional)<input type="text" id="f-ket" autocomplete="off"></label>'
    +'<label>Perusahaan internal<select id="f-co">'+opts+'</select></label><div class="er" id="e-co"></div>'
    +'<div class="card" style="margin-top:14px"><div class="ph" id="ph-b" data-a="shoot" data-v="b"><div class="th" id="th-b">Foto</div><div><b>Foto barang</b><div class="mu sm" id="ps-b">Ketuk untuk membuka kamera</div></div></div></div>'
    +'<div class="card"><div class="row"><b class="grow">Parkir</b><div class="seg"><button class="on" id="pk0" data-a="park" data-v="0">Tidak</button><button id="pk1" data-a="park" data-v="1">Ya</button></div></div>'
    +'<div id="pwrap" hidden><hr><div class="ph" id="ph-p" data-a="shoot" data-v="p"><div class="th" id="th-p">Foto</div><div><b>Foto tukang parkir</b><div class="mu sm" id="ps-p">Ketuk untuk membuka kamera</div></div></div></div></div>'
    +'<p class="bad" id="e-all"></p>'
    +'<button class="btn" id="save" data-a="save">Simpan titik</button><button class="btn out" data-a="back">Batal</button><div style="height:20px"></div>'}
function openStop(){
  if(!S.trip)return;
  ST={fb:'',fp:'',park:false,work:false};V='stop';
  $('#app').innerHTML=stopHtml();$('#app').scrollTop=0;render()}
function closeStop(){V='home';ST=null;render()}
function setPhoto(w,b64){
  ST['f'+w]=b64;var th=$('#th-'+w);th.innerHTML='<img alt="" src="data:image/jpeg;base64,'+b64+'">';
  $('#ps-'+w).textContent='Foto siap. Ketuk untuk ulang';$('#ph-'+w).classList.remove('err')}
['b','p'].forEach(function(w){$('#fi-'+w).addEventListener('change',function(){
  var f=this.files[0],inp=this;if(!f||!ST)return;
  ST.work=true;$('#ps-'+w).textContent='Memproses foto...';
  shrink(f).then(function(b){setPhoto(w,b)}).catch(function(e){$('#ps-'+w).textContent=e.message})
    .then(function(){if(ST)ST.work=false;inp.value=''})})});
function saveStop(){
  if(!ST||ST.work)return;
  var nama=$('#f-nama').value.trim(),nota=$('#f-nota').value.trim(),ket=$('#f-ket').value.trim(),co=$('#f-co').value,bad=false;
  function chk(id,ok,msg){$('#f-'+id).classList.toggle('err',!ok);$('#e-'+id).textContent=ok?'':msg;if(!ok)bad=true}
  chk('nama',!!nama,'Wajib diisi');chk('nota',!!nota,'Wajib diisi');chk('co',!!co,'Wajib dipilih');
  if(!ST.fb){$('#ph-b').classList.add('err');bad=true}
  if(ST.park&&!ST.fp){$('#ph-p').classList.add('err');bad=true}
  if(bad){$('#e-all').textContent='Lengkapi semua isian dan foto yang wajib.';return}
  if(!once())return;
  $('#e-all').textContent='';var btn=$('#save');btn.disabled=true;btn.textContent='Mengambil lokasi...';
  getPos().then(function(pos){
    var n=S.n+1,id=S.trip+'-'+n;
    var it={action:'saveStop',id_titik:id,id_perjalanan:S.trip,urutan:S.stops.length+1,nama_lokasi:nama,keterangan:ket,no_nota:nota,
      perusahaan:co,parkir:ST.park,lat:pos.latitude,lng:pos.longitude,waktu:now(),foto_barang:ST.fb};
    if(ST.park)it.foto_parkir=ST.fp;
    return qAdd(it).then(function(){
      S.n=n;S.stops.push({n:n,id:id,nama:nama,nota:nota,parkir:ST.park});persist();
      if(navigator.vibrate)navigator.vibrate(30);toast('Titik tersimpan');
      V='home';ST=null;return refreshQ()}).then(function(){render();flush()})})
  .catch(function(e){var b=$('#save');if(b){b.disabled=false;b.textContent='Simpan titik'}$('#e-all').textContent=e.message})}

/* ---------- riwayat ---------- */
function histTrips(){
  var cnt={};
  return H.data.map(function(o){var k=o.tanggal;cnt[k]=(cnt[k]||0)+1;if(!o.ret)o.ret=cnt[k];return o})}
function days(){var a=[],i;for(i=0;i<=8;i++){var d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a}
function histHtml(){
  var tr=histTrips(),ds=days(),h='<div class="row"><h2 class="grow">Riwayat</h2>'
    +(H.loading?'<span class="mu sm">Memuat...</span>':'<button class="lnk" data-a="reload"'+(S.online?'':' disabled')+'>Muat ulang</button>')+'</div>';
  if(!S.online)h+='<p class="mu sm">Offline. Menampilkan data terakhir yang tersimpan.</p>';
  h+='<div class="chips">'+ds.map(function(d,i){
    var cnt=tr.filter(function(t){return t.tanggal===ymd(d)}).length;
    var lb=i===0?'Hari ini':i===1?'Kemarin':pad(d.getDate())+'/'+pad(d.getMonth()+1);
    return '<button class="'+(H.sel===i?'on':'')+'" data-a="day" data-v="'+i+'">'+lb+(cnt?' | '+cnt+' ret':'')+'</button>'}).join('')+'</div>';
  if(H.fetched&&!H.ver)h+='<div class="tip">Server Apps Script belum versi terbaru, jadi rincian bisa belum lengkap. Deploy ulang Code.gs (Manage deployments, New version).</div>';
  var sh=tr.filter(function(t){return t.tanggal===ymd(ds[H.sel])}).sort(function(a,b){return b.ret-a.ret});
  if(!sh.length)h+='<p class="mu">Tidak ada perjalanan pada tanggal ini.</p>';
  sh.forEach(function(t){
    var ok=t.status==='disetujui',names=['Gudang'].concat(t.titik.map(function(x){return x.nama}));
    h+='<div class="card" data-a="trip" data-v="'+esc(t.id)+'"><div class="row"><b style="font-size:18px">Ret '+(t.ret||'')+'</b>'
      +'<span class="tag '+(ok?'':'w')+'">'+(ok?'Disetujui':t.status==='menunggu approve'?'Menunggu approve':'Berjalan')+'</span>'
      +'<span class="grow"></span>'+(ok?'<b>Rp '+n0(t.total)+'</b>':'')+'</div><div style="margin-top:4px">'+esc(names.join(' \u2192 '))+'</div></div>'});
  h+='<p class="mu sm" style="text-align:center">App PWA | Server '+(H.fetched?esc(H.ver||'lama'):'-')+'</p>';
  return h}
function loadHist(){
  if(!S.online||!S.u)return Promise.resolve();
  H.loading=true;if(tab==='history'&&V!=='stop')render();
  return post({action:'history',username:S.u,password:S.p}).then(function(r){
    if(r.ok){var d=r.data;if(Array.isArray(d)){H.data=d;H.ver=''}else{H.data=d.trips||[];H.ver=d.ver||''}H.fetched=true;sv('hist',H.data)}})
  .catch(function(){}).then(function(){H.loading=false;if(tab==='history'&&V!=='stop')render()})}
function detailHtml(t){
  var ok=t.status==='disetujui',tk=t.tarif_km||0,names=['Gudang'].concat(t.titik.map(function(x){return x.nama}));
  if(ok&&tk>0){
    var h='',nT=Math.max(t.titik.length-1,0),nP=t.titik.filter(function(x){return x.parkir==='ya'}).length;
    var sub=(t.biaya_jarak||0)+(t.biaya_titik||0),known=t.titik.some(function(x){return x.jarak>0});
    if(known)t.titik.forEach(function(x,k){h+='<p>'+esc(names[k])+' \u2192 '+esc(names[k+1])+' = '+k2(x.jarak||0)+' km</p>'});
    var billed=(t.biaya_jarak||0)/tk,bt=(billed%1===0)?n0(billed):k2(billed);
    h+='<p><b>Jarak = '+k2(t.jarak_km)+' km'+(Math.abs(billed-t.jarak_km)>0.004?' \u2192 '+bt+' km':'')+' x '+n0(tk)+' = '+n0(t.biaya_jarak)+'</b></p>'
      +'<p>Titik = '+nT+' x '+n0(t.tarif_titik)+' = '+n0(nT*t.tarif_titik)+'</p><p>Sub total = '+n0(sub)+'</p><p>Minimum = '+n0(t.minimum)+'</p>'
      +(nP?'<p>Parkir = '+nP+' x '+n0(t.tarif_parkir)+' = '+n0(nP*t.tarif_parkir)+'</p>':'')+'<p><b>Total = '+n0(t.total)+'</b></p>';
    return h}
  var h2=ok?'':'<p class="mu sm">Belum disetujui admin. Urutan bisa berubah setelah disusun admin.</p>';
  t.titik.forEach(function(x,k){
    h2+='<p>'+(k+1)+'. <b>'+esc(x.nama)+'</b><br><span class="mu sm">'+esc(x.perusahaan)+' | nota '+esc(x.nota)+(x.parkir==='ya'?' | Parkir':'')+(x.ket?' | '+esc(x.ket):'')+'</span>'
      +(t.status==='menunggu approve'?' <button class="lnk" data-a="edit" data-v="'+esc(t.id)+'|'+esc(x.id_titik)+'">Edit</button>':'')+'</p>'});
  if(!t.titik.length)h2+='<p class="mu">Belum ada titik</p>';
  if(ok)h2+='<p><b>Total = '+n0(t.total)+'</b></p>';
  return h2}
function openTrip(id){
  var t=histTrips().filter(function(x){return x.id===id})[0];if(!t)return;
  var st=t.status==='disetujui'?'Disetujui':t.status==='menunggu approve'?'Menunggu approve':'Berjalan';
  var btns=[{t:'Tutup',cls:'out'}];
  if(t.status!=='disetujui'&&t.id!==S.trip)btns.push({t:'Hapus perjalanan',cls:'out',f:function(){confirmDelTrip(t)}});
  modal('Ret '+(t.ret||'')+' | '+st,detailHtml(t),btns)}
function confirmDelTrip(t){
  modal('Hapus perjalanan ini?','<p>Semua titik dan foto di Telegram ikut terhapus. Hanya bisa selama belum disetujui admin.</p>',[
    {t:'Batal',cls:'out'},
    {t:'Hapus',f:function(){closeModal();
      post({action:'deleteTrip',id_perjalanan:t.id,username:S.u,password:S.p}).then(function(r){
        if(!r.ok)throw new Error(r.error);
        if(r.data&&r.data.blocked){toast('Sudah disetujui admin, tidak bisa dihapus');return loadHist()}
        H.data=H.data.filter(function(x){return x.id!==t.id});sv('hist',H.data);toast('Perjalanan dihapus');render()})
      .catch(function(e){toast(e instanceof TypeError?'Hapus butuh internet':e.message)})}}])}
function openEdit(tid,idt){
  var t=histTrips().filter(function(x){return x.id===tid})[0],x=t&&t.titik.filter(function(y){return y.id_titik===idt})[0];if(!x)return;
  var co=S.co.slice();if(x.perusahaan&&co.indexOf(x.perusahaan)<0)co.push(x.perusahaan);
  modal('Edit titik',
    '<label>Nama lokasi<input type="text" id="e1" value="'+esc(x.nama)+'"></label><label>Nomor nota<input type="text" id="e2" value="'+esc(x.nota)+'"></label>'
    +'<label>Keterangan (opsional)<input type="text" id="e3" value="'+esc(x.ket)+'"></label>'
    +'<label>Perusahaan internal<select id="e4"><option value="">Pilih perusahaan</option>'+co.map(function(c){return '<option'+(c===x.perusahaan?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label><p class="bad" id="em"></p>',[
    {t:'Batal',cls:'out'},
    {t:'Simpan',f:function(btn){
      var n=$('#e1').value.trim(),no=$('#e2').value.trim(),k=$('#e3').value.trim(),c=$('#e4').value;
      if(!n||!no||!c){$('#em').textContent='Nama lokasi, nomor nota, dan perusahaan wajib diisi';return}
      btn.disabled=true;btn.textContent='Menyimpan...';
      post({action:'editStop',id_titik:idt,nama_lokasi:n,no_nota:no,keterangan:k,perusahaan:c,username:S.u,password:S.p}).then(function(r){
        if(!r.ok)throw new Error(r.error);
        x.nama=n;x.nota=no;x.ket=k;x.perusahaan=c;sv('hist',H.data);closeModal();toast('Perubahan disimpan');render();loadHist()})
      .catch(function(e){btn.disabled=false;btn.textContent='Simpan';$('#em').textContent=e instanceof TypeError?'Butuh internet untuk menyimpan':e.message})}}])}

/* ---------- event ---------- */
var actions={
  login:login,logout:logout,add:openStop,back:closeStop,save:saveStop,cancel:cancelTrip,
  upl:function(){flush()},reload:function(){loadHist()},del:delStop,trip:openTrip,
  day:function(v){H.sel=Number(v);render()},
  edit:function(v){var p=v.split('|');closeModal();openEdit(p[0],p[1])},
  shoot:function(v){if(ST&&!ST.work)$('#fi-'+v).click()},
  park:function(v){ST.park=v==='1';$('#pk0').className=ST.park?'':'on';$('#pk1').className=ST.park?'on':'';$('#pwrap').hidden=!ST.park}};
function onAct(e){var el=e.target.closest('[data-a]');if(!el)return;
  var f=actions[el.getAttribute('data-a')];if(f){e.preventDefault();f(el.getAttribute('data-v'))}}
$('#app').addEventListener('click',onAct);$('#hdr').addEventListener('click',onAct);$('#modal').addEventListener('click',onAct);
$('#n-home').onclick=function(){tab='home';render()};
$('#n-hist').onclick=function(){tab='history';render();loadHist()};
window.addEventListener('online',function(){S.online=true;render();flush()});
window.addEventListener('offline',function(){S.online=false;render()});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){if(S.trip){lockScreen();startTrack()}flush()}});
setInterval(function(){if(S.u&&S.pending>0)flush();else if(S.u)refreshQ().then(renderHeader)},8000);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
refreshQ().then(function(){render();if(S.u&&S.trip)startTrack();flush()});
</script>
</body></html>
